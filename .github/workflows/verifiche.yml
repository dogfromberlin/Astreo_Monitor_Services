# Astreo Monitor - verifiche automatiche a ogni push su GitHub, su SQLite, PostgreSQL e SQL Server.
# Esito visibile nella scheda "Actions" del repository e accanto a ogni commit (✔ / ✘).
name: Verifiche

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: Pg_Admin_123
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Test_Pwd_12345!
        ports: ["1433:1433"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Strumenti di sistema
        run: sudo apt-get update && sudo apt-get install -y zstd postgresql-client
      - name: Dipendenze
        run: python -m pip install -r requirements-dev.txt
      - name: Database di prova
        run: |
          # PostgreSQL: utente dell'applicazione con CREATEDB (verifica del ripristino)
          PGPASSWORD=Pg_Admin_123 psql -h 127.0.0.1 -U postgres -c "CREATE ROLE astreo_app LOGIN CREATEDB PASSWORD 'App_Pg_123'" -c "CREATE DATABASE astreo_test"
          # SQL Server: attende l'avvio, poi database e utente dell'applicazione
          python - <<'PY'
          import time, pymssql
          for _ in range(60):
              try:
                  c = pymssql.connect(server="127.0.0.1", user="sa", password="Test_Pwd_12345!", autocommit=True); break
              except Exception:
                  time.sleep(3)
          cur = c.cursor()
          cur.execute("CREATE DATABASE astreo_test")
          cur.execute("CREATE LOGIN astreo_monitor_app WITH PASSWORD = 'App_Pwd_12345!', CHECK_POLICY = OFF")
          cur.execute("USE astreo_test; CREATE USER astreo_monitor_app FOR LOGIN astreo_monitor_app; "
                      "ALTER ROLE db_datareader ADD MEMBER astreo_monitor_app; ALTER ROLE db_datawriter ADD MEMBER astreo_monitor_app")
          PY
      - name: Codice Python
        run: python -m pyflakes astreo_monitor tests
      - name: Sintassi JavaScript
        run: for f in astreo_monitor/web/static/js/*.js; do node --check "$f"; done
      - name: Script SMART
        run: bash -n deploy/bin/astreo-smart-collect
      - name: Test (SQLite, PostgreSQL, SQL Server)
        env:
          ASTREO_TEST_PG: "127.0.0.1:5432:astreo_test:astreo_app:App_Pg_123:postgres:Pg_Admin_123"
          ASTREO_TEST_MSSQL: "127.0.0.1:1433:astreo_test:astreo_monitor_app:App_Pwd_12345!:sa:Test_Pwd_12345!"
        run: python -m pytest -q tests
