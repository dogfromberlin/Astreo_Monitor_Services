# =============================================================================
# Astreo Monitor 2.0 - configurazione di esempio
# Copiare in /etc/astreo-monitor/config.ini (permessi 600, proprietario <utente>)
# e compilare i campi vuoti. Il file reale NON va mai messo in git.
# Documentazione: docs/configurazione.md
# =============================================================================

[database]
host = <IP-LAN>
port = 1433
database = astreo_monitor
# Utente dedicato creato da sql/001_install.sql (non usare sa)
user = astreo_monitor_app
password =
login_timeout = 10
timeout = 30

[email]
enabled = true
sender =
# Più destinatari separati da virgola
recipients =
smtp_host = smtp.gmail.com
smtp_port = 465
# ssl (porta 465) | starttls (porta 587) | none
security = ssl
username =
# Per Gmail: password per le app (https://myaccount.google.com/apppasswords)
password =
subject_prefix = [Astreo Monitor]

[web]
host = 0.0.0.0
port = 5025
threads = 8
username = <utente>
# Hash della password, generato con il comando indicato in docs/configurazione.md
password_hash =

[services]
# chiave = unit systemd | etichetta mostrata in dashboard
openvpn = openvpn | OpenVPN
mssql = mssql-server.service | SQL Server
nginx = nginx | Nginx
apache = apache2 | Apache
ollama = ollama | Ollama
docker = docker | Docker
medusa = medusa-backend.service | Medusa backend
pihole = pihole-FTL.service | Pi-hole

[metrics]
# Disco controllato per gli allarmi
root_disk = /
temp_warning = 85
temp_alert = 95
disk_warning = 85
disk_alert = 95
notify = true
# Promemoria se l'allarme resta attivo (ore, 0 = mai)
reminder_hours = 24

[speedtest]
# Soglie in Mbps: sotto "warning" -> WARNING, sotto "alert" -> ALERT
download_alert = 100
download_warning = 500
upload_alert = 50
upload_warning = 200
# Connessioni parallele per giro, numero di giri, byte per connessione
streams = 4
rounds = 3
download_bytes = 25000000
upload_bytes = 10000000
timeout = 60
# Prima settimana: false, per ricalibrare le soglie sui valori reali
notify = false
reminder_hours = 24

[publicip]
providers = https://checkip.amazonaws.com, https://api.ipify.org, https://ifconfig.me/ip
timeout = 10
notify = true

[retention]
# Giorni di conservazione dei dati grezzi (0 = per sempre)
metrics_days = 365
temperature_days = 365
speedtest_days = 0
publicip_days = 0

[backup]
# Database da salvare (separati da virgola); ognuno richiede i permessi di sql/004_backup.sql
databases = astreo_monitor, <altro-database>
# Cartella dove SQL Server scrive il .bak (proprietario mssql, gruppo <utente>, permessi 2770)
sql_dir = /srv/sqlbackup
# Copie compresse conservate su astreo
local_dir = /home/<utente>/backups/sql
local_keep = 7
# Repository GitHub privato per le Release (vuoto = nessun upload)
github_repo = dogfromberlin/<repository-backup>
github_keep = 30
# Compressione zstd da 1 (veloce) a 19 (massima)
zstd_level = 19
# Secondi massimi per ogni operazione (backup, compressione, upload)
timeout = 900
notify = true
reminder_hours = 24
