# =============================================================================
# Astreo Monitor - configurazione di esempio.
# Di norma la crea l'installatore (sudo bash install.sh); questo file serve come riferimento.
# Percorso: /etc/astreo-monitor/config.ini (permessi 600, proprietario: l'utente dei servizi)
# e compilare i campi vuoti. Il file reale NON va mai messo in git.
# Documentazione: docs/it/configuration.md
# =============================================================================

[database]
# Database: mssql (SQL Server, anche Express), postgresql oppure sqlite.
# Dopo averlo scelto, crea o aggiorna lo schema con: python -m astreo_monitor.migrate
engine = mssql
# --- mssql e postgresql (porta predefinita 1433 / 5432)
host = 127.0.0.1
port = 1433
database = astreo_monitor
# Utente dell'applicazione, con soli permessi di lettura e scrittura (non l'amministratore)
user = astreo_monitor_app
password =
login_timeout = 10
timeout = 30
# --- sqlite: solo il percorso del file (host, utente e password non servono)
# path = /var/lib/astreo-monitor/astreo_monitor.db

[email]
# Valori INIZIALI: poi si modificano da Impostazioni > Notifiche.
enabled = true
sender =
# Più destinatari separati da virgola
recipients =
smtp_host = smtp.gmail.com
smtp_port = 465
# ssl (porta 465) | starttls (porta 587) | none
security = ssl
username =
# Per Gmail: password per le app (https://myaccount.google.com/apppasswords)
password =
subject_prefix = [Astreo Monitor]

[web]
host = 0.0.0.0
port = 5025
threads = 8
username = admin
# Hash della password, generato con il comando indicato in docs/it/configuration.md
password_hash =
# Con HTTPS la dashboard è servita da nginx (porta 5443): waitress
# ascolta solo in locale e si fida degli header di nginx.
# host = 127.0.0.1
# trusted_proxy = 127.0.0.1
trusted_proxy =

[services]
# Solo elenco INIZIALE: poi i servizi monitorati si gestiscono dalla
# dashboard (Impostazioni > Servizi) e sono salvati nel database.
# chiave = unit systemd | etichetta mostrata in dashboard
ssh = ssh | SSH
nginx = nginx | Nginx
docker = docker | Docker

[metrics]
# Disco controllato per gli allarmi
root_disk = /
temp_warning = 85
temp_alert = 95
disk_warning = 85
disk_alert = 95
notify = true
# Promemoria se l'allarme resta attivo (ore, 0 = mai)
reminder_hours = 24

[speedtest]
# Valori INIZIALI: poi soglie, parametri di misura e avvisi si modificano
# dalla dashboard (Impostazioni > Speedtest) e quelli salvati hanno la precedenza.
# Soglie in Mbps: sotto "warning" -> WARNING, sotto "alert" -> ALERT
download_alert = 100
download_warning = 500
upload_alert = 50
upload_warning = 200
# Connessioni parallele per giro, numero di giri, byte per connessione
streams = 4
rounds = 3
download_bytes = 25000000
upload_bytes = 10000000
timeout = 60
# Prima settimana: false, per ricalibrare le soglie sui valori reali
notify = false
reminder_hours = 24

[publicip]
providers = https://checkip.amazonaws.com, https://api.ipify.org, https://ifconfig.me/ip
timeout = 10
notify = true

[retention]
# Giorni di conservazione dei dati grezzi (0 = per sempre)
metrics_days = 365
temperature_days = 365
speedtest_days = 0
publicip_days = 0

[backup]
# Database da salvare (separati da virgola). SQL Server: permessi in sql/mssql_permessi_backup.sql
databases = astreo_monitor
# Solo SQL Server: cartella dove il server scrive il .bak (proprietario mssql, gruppo dell'utente dei servizi, permessi 2770)
sql_dir = /srv/sqlbackup
# Copie compresse conservate sul server
local_dir = /var/backups/astreo-monitor
local_keep = 7
# Repository GitHub privato per le Release (vuoto = nessun upload)
github_repo =
github_keep = 30
# Compressione zstd da 1 (veloce) a 19 (massima)
zstd_level = 19
# Secondi massimi per ogni operazione (backup, compressione, upload)
timeout = 900
notify = true
reminder_hours = 24

# [netpulse]
# Modulo facoltativo: API per il widget Windows NetPulse, protette da un token.
# token_file = /etc/astreo-monitor/netpulse_token

[terminal]
# Terminale web (vedi docs/it/https-terminal.md). Disattivato finché non lo abiliti.
enabled = false
# Hash della password del terminale: DIVERSA da quella della dashboard
password_hash =
# Durata della sessione dopo lo sblocco (minuti)
session_minutes = 15
# Reti da cui è ammesso (LAN e VPN), separate da virgola
allowed_networks = 192.168.0.0/24
