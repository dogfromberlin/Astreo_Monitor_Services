<div class="view" data-view="terminale" hidden>
  <section class="panel terminal-panel">
    <div class="panel-head">
      <h2>{{ _("Terminale") }} <button type="button" class="help-btn" data-help="https-terminal#terminale" aria-label="{{ _("Aiuto") }}" title="{{ _("Aiuto") }}">?</button></h2>
      <small id="term-session"></small>
      <button type="button" class="ghost" id="term-lock" hidden>{{ _("Chiudi terminale") }}</button>
    </div>

    <div id="term-blocked" class="term-message" hidden></div>

    <form id="term-unlock" class="term-unlock" hidden>
      <p>{{ _("Il terminale apre una shell sul server come utente") }} <strong>{{ service_user }}</strong>{{ _(", con gli stessi permessi di una sessione SSH. Per aprirlo serve la") }} <strong>{{ _("password del terminale") }}</strong>{{ _(", diversa da quella della dashboard.") }}</p>
      <label>{{ _("Password del terminale") }}
        <input type="password" name="password" autocomplete="off" required>
      </label>
      <button type="submit">{{ _("Sblocca") }}</button>
      <p class="hint" id="term-unlock-info"></p>
    </form>

    <div id="term-frame-wrap" class="term-frame-wrap" hidden>
      <iframe id="term-frame" title="{{ _("Terminale del server") }}" referrerpolicy="same-origin"></iframe>
    </div>
  </section>
</div>
